<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070c" />
  <title>Spatial Anomaly AR</title>
  <meta name="description" content="跨 iPhone / Android 的 WebAR 空間錨定生成藝術實驗。" />

  <!--
    This product includes the XR Engine software developed by Niantic Spatial, Inc.
    Copyright © 2026 Niantic Spatial, Inc. All rights reserved.
    License: https://github.com/8thwall/engine/blob/main/LICENSE
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
    async
    crossorigin="anonymous"
    data-preload-chunks="slam"></script>
  <link rel="stylesheet" href="./src/index.css?v=5" />
</head>
<body>
  <canvas id="camerafeed" aria-label="AR camera"></canvas>

  <div id="hud" class="hud">
    <div class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>SPATIAL ANOMALY · V5</span>
      </div>
      <div id="trackingBadge" class="badge">LOADING XR</div>
    </div>

    <div id="reticle" class="reticle" aria-hidden="true">
      <span class="reticle-ring"></span>
      <span class="reticle-dot"></span>
    </div>

    <div id="statusPanel" class="status-panel">
      <div id="statusTitle" class="status-title">正在載入 AR 引擎</div>
      <div id="statusText" class="status-text">相機還沒有開始。引擎就緒後會自動要求相機權限。</div>
      <div class="placement-hint">TAP TO PLACE</div>
    </div>

    <div id="controls" class="controls is-hidden">
      <button id="respawnButton" type="button">換一種藝術</button>
      <button id="repositionButton" type="button" class="secondary">重新選位置</button>
    </div>

    <div class="footer-note">先點位置 → 生成 → 再移動鏡頭觀察它是否留在原地。</div>
  </div>

  <div id="fatal" class="fatal is-hidden">
    <div class="fatal-card">
      <h1>無法啟動 AR</h1>
      <p id="fatalText">請使用支援的手機瀏覽器，並確認已允許相機權限。</p>
      <button id="retryButton" type="button" class="retry-button">重新啟動</button>
    </div>
  </div>

  <script type="module" src="./src/app.js?v=5"></script>
</body>
</html>
